services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pain_radar}
      POSTGRES_USER: ${POSTGRES_USER:-pain_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pain_radar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pain_radar} -d ${POSTGRES_DB:-pain_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api/Dockerfile
    # No env_file here: Laravel reads the bind-mounted .env itself via
    # dotenv. Injecting the same vars as real container env vars would
    # take precedence over phpunit.xml's <env> testing overrides (OS env
    # vars beat PHPUnit's env block even with force="true") and make
    # RefreshDatabase run against the real Postgres. See phpunit.xml.
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - ./config:/config:ro
    environment:
      SOURCES_REGISTRY_PATH: /config/sources.yaml
      TOPICS_REGISTRY_PATH: /config/topics.yaml
      KEYWORDS_REGISTRY_PATH: /config/keywords.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web/Dockerfile
    env_file:
      - ./apps/web/.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  intelligence:
    build:
      context: ./apps/intelligence
      dockerfile: ../../infrastructure/docker/intelligence/Dockerfile
    env_file:
      - ./apps/intelligence/.env
    volumes:
      - ./apps/intelligence:/app
      - ./config:/config:ro
    environment:
      SOURCES_REGISTRY_PATH: /config/sources.yaml
      TOPICS_REGISTRY_PATH: /config/topics.yaml
      SIGNAL_RULES_PATH: /config/signal_rules.yaml
      SCORING_CONFIG_PATH: /config/scoring.yaml
      LLM_CONFIG_PATH: /config/llm.yaml
      EVAL_CASES_PATH: /app/evaluation/cases.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "intelligence.cli", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  api_vendor:
  web_node_modules:

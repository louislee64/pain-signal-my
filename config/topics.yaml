  # ---------------------------------------------------------------------------
  # The eight topics below carried NO keywords until a text source existed to
  # test them against, which meant the rule-based classifier (§23) could never
  # match them no matter what was ingested. The phrases here were chosen by
  # running candidates over a live 191-article Malaysian news corpus and reading
  # what each one actually matched — see docs/text-sources.md.
  #
  # Every phrase is multi-word on purpose. Single common words were tried and
  # rejected because of what they matched in real text:
  #
  #   "cukai" (tax)          -> "keuntungan sebelum cukai" (profit BEFORE tax),
  #                             i.e. every bank earnings report.
  #   "kos sara hidup"       -> "Kementerian Perdagangan Dalam Negeri dan Kos
  #                             Sara Hidup" — the ministry's own name, so every
  #                             article quoting KPDN became a cost-pressure
  #                             signal. "tekanan kos" is used instead.
  #   "system integration"   -> an ECRL railway commissioning story.
  #   "profit margin"        -> listed-company earnings downgrades (Gamuda,
  #                             Toyota), not SME margin pain.
  #   "cash flow"            -> "negative free cash flow" in analyst notes.
  #   "automation"           -> semiconductor fab capacity announcements.
  #
  # A keyword that fires on the wrong thing is worse than a missing one: §41
  # forbids letting weak evidence look strong, and a false signal is counted by
  # mention_frequency exactly like a real one.
  #
  # Several phrases below match nothing in the current corpus. That is fine and
  # deliberate — they are correct descriptions of the topic that will fire when
  # such an article appears. Absence today is a fact about the news cycle, not
  # evidence the keyword is wrong.

  - slug: payment_refund

  - slug: price_cost_pressure
    name: Price / Cost Pressure
    description: Problems caused by rising supplier or input costs.
    # §14 explicitly endorses deriving SME cost pressure from macro price data
    # ("Chicken price increased" -> "Restaurants may be experiencing ingredient
    # cost pressure"), which is what these phrases actually find: central-bank
    # and producer-cost commentary rather than an owner complaining. That is
    # legitimate weak evidence, and it stays weak by construction —
    # config/scoring.yaml gives this topic implementation_fit 30 under §28
    # precisely because software does not fix input costs.
    keywords:
      - cost pressure
      - cost pressures
      - rising operating cost
      - operating cost pressure
      - input cost pressure
      - margin squeeze
      - squeeze on margin
      - tekanan kos
      - kos operasi meningkat
      - kenaikan kos operasi
      - 成本压力
      - 经营成本上涨


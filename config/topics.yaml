  - slug: payment_refund
    name: Payment & Refund
    description: Problems collecting payment or processing refunds.

  - slug: compliance_reporting
    name: Compliance & Reporting
    description: Problems meeting regulatory/compliance reporting obligations.

  - slug: workflow_manual_process
    name: Manual Workflow / Process
    description: Recurring manual work that should be automated.

  - slug: staff_operations
    name: Staff Operations
    description: Problems scheduling, training, or managing staff.

  - slug: price_cost_pressure
    name: Price / Cost Pressure
    description: Problems caused by rising supplier or input costs.

  - slug: software_integration
    name: Software Integration
    description: Problems connecting one system/tool to another (POS, ERP, accounting).

  - slug: data_reporting

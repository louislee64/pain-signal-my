  - slug: vulcanpost_my
    name: "Vulcan Post Malaysia"
    source_type: news_feed
    base_url: "https://vulcanpost.com"
    collector: rss_feed
    config:
      feed_url: "https://vulcanpost.com/feed/"
      fetch_articles: false
      requests_per_minute: 20
      language: en
      # No region claim. See the note below — this feed is mostly not Malaysian,
      # and `region: MY` would be an assertion the content does not support.
      region: null
    collection_method: rss
    rate_limit: "20/minute"
    reliability_score: 70
    license: "All rights reserved by publisher; headline/summary use only"
    terms_url: "https://vulcanpost.com/terms-of-service/"
    terms_status: unreviewed
    personal_data_risk: low
    # DISABLED on measured evidence, not on principle. This feed has by far the
    # richest SME-operational content of everything tested — a merchant whose
    # margins fell from 28% to 6%, SME owners explaining why they borrow — which
    # is exactly what this project wants and no Malaysian feed provided.
    #
    # But 9 of its 10 entries were about SINGAPORE (S$, "S'pore", Singaporean
    # companies) and only 3 mentioned Malaysia at all. Ingesting it as MY
    # evidence would put Singaporean businesses behind Malaysian opportunity
    # scores, and §41 forbids exactly this: weak or mislabelled evidence
    # presented as strong. Geographic spread (§26, weight 0.15) would be
    # measuring the wrong country.
    #
    # To use it properly the collector would need per-entry country detection
    # rather than a per-source region constant. That is a real feature, not a
    # config tweak, so the feed stays off until someone builds it.
    enabled: false


    base_url: "https://www.utusan.com.my"
    collector: rss_feed
    config:
      feed_url: "https://www.utusan.com.my/feed/"
      # Measured: 10 entries, ~2,120 characters each.
      fetch_articles: false
      requests_per_minute: 20
      language: ms
      region: MY
    collection_method: rss
    rate_limit: "20/minute"
    reliability_score: 60
    license: "All rights reserved by publisher; headline/summary use only"
    terms_url: "https://www.utusan.com.my/"
    terms_status: unreviewed

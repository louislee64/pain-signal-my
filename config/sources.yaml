# Source registry (PROJECT_SPEC.md §12).
#
# `collector` names a Python collector class registered in
# apps/intelligence/src/intelligence/collectors/registry.py — it is never a
# hard-coded per-dataset class. Adding a new data.gov.my/OpenDOSM dataset is a
# config-only change: copy the fuelprice entry below with a different `slug`
# and `config.dataset_id`. See docs/adding-a-data-source.md.
#
# Sync this file into the `sources` table with: php artisan sources:sync

sources:
  - slug: data_gov_my_fuelprice
    name: "Malaysia Weekly Retail Fuel Price"
    source_type: official_dataset
    base_url: "https://api.data.gov.my/data-catalogue"
    collector: data_gov_my_dataset
    config:
      dataset_id: fuelprice
      date_column: date
    collection_method: http_api
    rate_limit: "4/minute"
    reliability_score: 95
    license: "Terms of Use for Government Open Data Malaysia 1.0"
    terms_url: "https://www.mot.gov.my/en/Documents/Terms%20of%20Use%20Government%20Open%20Data%201.0.pdf"
    terms_status: reviewed
    personal_data_risk: none
    enabled: true

  # ---------------------------------------------------------------------------
  # Public text sources (§17), via the `rss_feed` collector — §13's tier 3,
  # "official RSS/feed". Adding another feed is a config-only change.
  #
  # TERMS STATUS — READ THIS BEFORE ADDING MORE.
  #
  # Every feed below is marked `unreviewed`, and that is accurate rather than
  # lazy. What was actually verified, per host, is narrow:
  #
  #   * robots.txt permits the article paths for our User-Agent (checked
  #     programmatically; businesstoday.com.my declares Crawl-delay: 10, which
  #     the collector honours).
  #   * The feed is published openly, with no credential or paywall.
  #
  # What was NOT verified is each publisher's Terms of Use, and specifically
  # whether storing extracted full-article text is permitted. That is a
  # copyright judgement about someone else's content, not a technical check, so
  # it stays `unreviewed` until a human decides. §17 asks for exactly this
  # ("review terms") and it is deliberately not being claimed here.
  #
  # `fetch_articles` is therefore set to `false` wherever measurement showed the
  # feed already carries the full body — which is most of them. Only two feeds
  # publish headlines alone, so full-text extraction touches two publishers
  # rather than nine. See docs/text-sources.md for the measurements.
  #
  # personal_data_risk is `low`, not `none`: news prose is human-written and can
  # name people. The collector drops bylines and redacts emails/phone numbers
  # before storage (§21), so no identifier is stored deliberately, but the text
  # is not machine-generated the way fuel prices are.

  - slug: fmt_business
    name: "Free Malaysia Today — Business"
    source_type: news_feed
    base_url: "https://www.freemalaysiatoday.com"
    collector: rss_feed
    config:
      feed_url: "https://www.freemalaysiatoday.com/category/business/feed/"
      # Measured: 50 entries, ~2,370 characters of content:encoded each.
      fetch_articles: false
      requests_per_minute: 20
      language: en
      region: MY
    collection_method: rss
    rate_limit: "20/minute"
    reliability_score: 65
    license: "All rights reserved by publisher; headline/summary use only"
    terms_url: "https://www.freemalaysiatoday.com/terms-of-use/"
    terms_status: unreviewed
    personal_data_risk: low
    enabled: true

  - slug: malaymail_money
    name: "Malay Mail — Money"

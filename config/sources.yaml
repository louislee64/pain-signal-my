      fetch_articles: false
      requests_per_minute: 20
      language: en
      region: MY
    collection_method: rss
    rate_limit: "20/minute"
    reliability_score: 70
    license: "All rights reserved by publisher; headline/summary use only"
    terms_url: "https://www.digitalnewsasia.com/"
    terms_status: unreviewed
    personal_data_risk: low
    enabled: true

  - slug: hmetro_bm
    name: "Harian Metro (Bahasa Malaysia)"
    source_type: news_feed
    base_url: "https://www.hmetro.com.my"
    collector: rss_feed
    config:
      feed_url: "https://www.hmetro.com.my/feed"
      # Measured: the HIGHEST SME-operational hit rate of every feed tested
      # (7/51 entries), on terms no English feed produced at all — "kos operasi",
      # "peniaga", "pekerja asing", "kos sara hidup". §43's insistence on
      # multilingual processing earns its keep here rather than in theory.
      fetch_articles: false
      requests_per_minute: 20
      language: ms
      region: MY
    collection_method: rss
    rate_limit: "20/minute"
    reliability_score: 55
    license: "All rights reserved by publisher; headline/summary use only"
    terms_url: "https://www.hmetro.com.my/"
    terms_status: unreviewed
    personal_data_risk: low
    enabled: true

  - slug: utusan_bm

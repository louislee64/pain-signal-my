[project]
name = "intelligence"
version = "0.1.0"
description = "Malaysia SME Pain Radar - Python data/analytics package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "python-dotenv>=1.0,<2",
    "python-ulid>=2.2,<3",
    "pyyaml>=6.0,<7",
    # RSS/Atom parsing (§13's "official RSS/feed" tier). feedparser handles the
    # malformed-but-real feeds publishers actually serve — mismatched encodings,
    # RSS 2.0 vs Atom, missing dates — which is exactly the work not worth
    # hand-rolling with regex.
    "feedparser>=6.0,<7",
    # Article-body extraction for feeds that carry only a headline (§17). The
    # boring choice: this is trafilatura's single purpose, and the alternative is
    # per-publisher CSS selectors that break on every redesign.
    "trafilatura>=1.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
# Google Trends BigQuery discovery (PROJECT_SPEC.md §15A). Deliberately optional:
# heavy, and unusable without a billed GCP project + service-account credentials.
# See docs/trends-data-sources.md.
bigquery = [
    "google-cloud-bigquery>=3.25,<4",
]
# Anthropic LLM extraction (PROJECT_SPEC.md §24). Optional for the same reason
# as bigquery: unusable without an API key, and every code path that needs it
# already refuses to run with an actionable message. The fixture provider covers
# the tests and CI at zero cost. See docs/llm-providers.md.
anthropic = [
    "anthropic>=0.75,<1",
]

[project.scripts]
intelligence = "intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

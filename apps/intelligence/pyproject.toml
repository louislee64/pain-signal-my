[project]
name = "intelligence"
version = "0.1.0"
description = "Malaysia SME Pain Radar - Python data/analytics package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
intelligence = "intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

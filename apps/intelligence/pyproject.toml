[project]
name = "intelligence"
version = "0.1.0"
description = "Malaysia SME Pain Radar - Python data/analytics package"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "python-dotenv>=1.0,<2",
    "python-ulid>=2.2,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
# Google Trends BigQuery discovery (PROJECT_SPEC.md §15A). Deliberately optional:
# heavy, and unusable without a billed GCP project + service-account credentials.
# See docs/trends-data-sources.md.
bigquery = [
    "google-cloud-bigquery>=3.25,<4",
]

[project.scripts]
intelligence = "intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
